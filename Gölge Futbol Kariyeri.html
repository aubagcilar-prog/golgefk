 <table><tr><th>Oyuncu</th><th>Mv</th><th>Yaş</th><th>Güç</th><th>Pot</th><th>Değer</th></tr>${L.map(p=>`<tr onclick="offM(${p.id})"><td>${p.n}</td><td>${p.p}</td><td>${p.a}</td><td>${p.o}</td><td>${p.pt}</td><td>${mny(pv(p))}</td></tr>`).join("")}</table><p class="m">Oyuncuya dokunarak teklif ver. Teklifler bonservis, maaş ve süre içerir.</p>`}
function offM(pid){const free=XT==="F",p=(free?W.fa:T(+XT).pl).find(x=>x.id===pid);md(`<h3>${p.n}</h3><div class="m">${p.p} · ${p.a} yaş · Güç ${p.o}/${p.pt} · Değer ${mny(pv(p))} · Mevcut maaş ${mny(p.w)}</div>${free?"":`<label class="m">Bonservis (M₺)</label><input id="of" type="number" step="0.1" value="${r2(pv(p)*1.05)}">`}<label class="m">Yıllık maaş (M₺)</label><input id="ow" type="number" step="0.01" value="${r2(p.w*1.1)}"><label class="m">Sözleşme (yıl)</label><select id="oy"><option>1</option><option>2</option><option selected>3</option><option>4</option></select><div id="om" class="bad"></div><button class="b g" onclick="doOffer(${pid},'${XT}')">Teklif yap</button><button class="b" onclick="closeM()">Vazgeç</button>`)}
function vC(){const m=me();return `<div class="seg">${[["f","Finans"],["t","Teknik Dir."],["y","Tesis"],["s","Stadyum"]].map(([k,l])=>`<button class="${SC===k?"on":""}" onclick="SC='${k}';render()">${l}</button>`).join("")}</div>`+({f:cF,t:cT,y:cY,s:cS}[SC])()}
function cF(){const m=me(),r=rev(m),l=W.led,inc=l.tk+l.tv+l.sp+l.mr,exp=l.wg+l.st+l.up+l.fac+l.tf,cap=r.tot*.8,sp=spendOf(m),ln=(a,b,c)=>`<div class="r"><span>${a}</span><span class="${c||""}">${b}</span></div>`;
 return `<div class="c"><div class="m">Kasa</div><div class="h ${m.cash<0?"bad":""}">${mny(m.cash)}</div>${m.cash<0?'<div class="bad">Borç faizi işliyor. Gider kıs ya da oyuncu sat.</div>':""}</div><div class="c"><h3>Bu sezon gelir</h3>${ln("Bilet",mny(l.tk))}${ln("Yayın hakları",mny(l.tv))}${ln("Sponsorluk",mny(l.sp))}${ln("Forma ve ürün",mny(l.mr))}${ln("Transfer satışı",mny(l.ts))}${ln("<b>Toplam</b>",mny(inc+l.ts),"good")}</div>
 <div class="c"><h3>Bu sezon gider</h3>${ln("Futbolcu maaşları",mny(l.wg))}${ln("Teknik ekip ve tesis işletme",mny(l.st))}${ln("Stadyum bakımı",mny(l.up))}${ln("Tesis ve stadyum yatırımı",mny(l.fac))}${ln("Transfer bonservisi",mny(l.tf))}${ln("<b>Toplam</b>",mny(exp),"bad")}</div>
 <div class="c"><h3>Finansal fair play</h3>${ln("Yıllık harcama sınırı",mny(cap))}${ln("Mevcut harcama",mny(sp),sp>cap?"bad":"good")}<div class="bar"><i style="width:${cl(sp/cap*100,0,100)}%"></i></div><div class="m">Harcama = maaşlar + teknik ekip + bonservislerin üçte biri. Kademe: ${m.fp}/5 (1 uyarı, 2 para cezası, 3 transfer yasağı, 4-5 puan silme). Kasadaki para sınırı değiştirmez.</div></div><div class="m">Maç günü seyirci: ${Math.round(r.att)} / ${capOf(m)} koltuk</div>`}
function cT(){const c=me().co,bar=(l,v)=>`<div class="r"><span>${l}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div>`;
 return `<div class="c"><div class="r"><h3>${c.n}</h3><span class="m">${c.a} yaş · ${mny(c.sal)}/yıl</span></div>${bar("Taktik",c.tac)}${bar("Gelişim",c.dev)}${bar("Kondisyon",c.fit)}${bar("Motivasyon",c.mot)}${bar("Sadakat",c.loy)}${bar("Başkanla ilişki",c.rel)}<button class="b" onclick="coachM()">Teknik direktörü değiştir</button></div><p class="m">İlk 11, diziliş ve antrenmanı teknik direktör yönetir. Taktik ve motivasyon maç gücünü, gelişim değeri genç oyuncuların büyümesini etkiler.</p>`}
function coachM(){md(`<h3>Aday teknik direktörler</h3><div class="m">Mevcut direktöre tazminat: ${mny(me().co.sal*.6)}</div>${W.cands.map((c,i)=>`<div class="c"><div class="r"><b>${c.n}</b><span class="m">${mny(c.sal)}/yıl</span></div><div class="m">Taktik ${c.tac} · Gelişim ${c.dev} · Kond. ${c.fit} · Motiv. ${c.mot}</div><button class="b sm g" onclick="hire(${i})">İşe al</button></div>`).join("")}<button class="b" onclick="closeM()">Kapat</button>`)}
function cY(){const m=me(),N={a:["Altyapı akademisi","Genç oyuncu kalitesi"],t:["Antrenman tesisi","Oyuncu gelişimi"],m:["Sağlık merkezi","Sakatlık süresi"],s:["Keşif ağı","Altyapı yetenek keşfi"]};
 return (W.proj?`<div class="c o">Devam eden proje: ${W.proj.msg} <b>${W.proj.left} hafta</b> kaldı.</div>`:"")+Object.keys(N).map(k=>{const l=m.fac[k],c=r2(Math.max(.03,rev(m).tot*.05*(l+1)));return `<div class="c"><div class="r"><h3>${N[k][0]}</h3><b>Seviye ${l}/10</b></div><div class="bar"><i style="width:${l*10}%"></i></div><div class="m">${N[k][1]}. İşletme gideri seviyeyle artar.</div><button class="b" ${l>=10||W.proj?"disabled":""} onclick="upg('${k}')">Geliştir · ${mny(c)} · ${6+2*l} hafta</button></div>`}).join("")}
function cS(){const m=me(),n=["Kuzey","Güney","Doğu","Batı"];return `<div class="c"><div class="r"><h3>${W.o.stad}</h3><b>${capOf(m)} koltuk</b></div><div class="m">Seyirci talebi: ${Math.round(dem(m))}. Talep kapasiteyi aşmıyorsa genişleme gelir getirmez, bakım gideri artar.</div></div>${W.proj?`<div class="c o">Devam eden proje: ${W.proj.msg} (${W.proj.left} hafta)</div>`:""}${m.s.map((s,i)=>{const seats=Math.round(s*.15+60),c=r2(seats*PRC[m.L]*45/1e6);return `<div class="c"><div class="r"><span>${n[i]} tribünü: <b>${s}</b></span><button class="b sm" ${W.proj?"disabled":""} onclick="upS(${i})">+${seats} · ${mny(c)}</button></div></div>`}).join("")}`}
function vL(){const L=LV>=0?LV:me().L,ids=W.lg[L].map(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf),tp=[].concat(...W.lg[L].map(i=>T(i).pl.map(p=>[p,T(i)]))).sort((a,b)=>b[0].g-a[0].g).slice(0,5);
 return `<select onchange="LV=+this.value;render()">${LG.map((l,i)=>`<option value="${i}" ${L===i?"selected":""}>${l}</option>`).join("")}</select><div class="c" style="padding:4px 8px"><table><tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr>${ids.map((t,i)=>`<tr class="${t.id===W.me?"me":""}"><td>${i+1}. ${t.n}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td>${t.pts}</td></tr>`).join("")}</table></div>
 <h2>Gol krallığı</h2><div class="c">${tp.map(([p,t])=>`<div class="r"><span>${p.n} <span class="m">${t.n}</span></span><b>${p.g}</b></div>`).join("")}</div><h2>Maçlarım</h2><div class="c">${W.res.slice().reverse().slice(0,8).map(x=>`<div class="r"><span class="m">H${x.w+1}</span><span>${T(x.h).n} <b>${x.g[0]}–${x.g[1]}</b> ${T(x.a).n}</span></div>`).join("")||'<div class="m">Henüz maç oynanmadı.</div>'}</div>`}
function vH(){const h=W.hist.slice().reverse(),t=W.hist.filter(s=>s.my.pos===1).length;return `<div class="c"><div class="r"><span>Oynanan sezon</span><b>${W.hist.length}</b></div><div class="r"><span>Şampiyonluk</span><b>${t}</b></div></div>${h.map(s=>`<div class="c"><h3>${yr(s.s)}</h3><div class="m">Süper Lig şampiyonu: <b style="color:var(--ink)">${s.ch[0]}</b></div><div class="m">${LG[s.my.L]} şampiyonu: ${s.ch[s.my.L]} · Sen: ${s.my.pos}. sıra</div><div class="m">Gol kralı: ${s.gk.n} (${s.gk.t}, ${s.gk.v}) · Asist: ${s.ak.n} (${s.ak.v}) · Kart: ${s.yk.n} (${s.yk.v})</div><div class="m">Yükselenler (${s.up.length}) · Düşenler (${s.dn.length})</div></div>`).join("")||'<div class="m">İlk sezon tamamlandığında tarih burada oluşur.</div>'}`}
/* menü ekranları */
const vMenu=()=>{const s=saves(),l=localStorage.getItem?.("gfk_last");return `<div style="padding:50px 0 20px"><h1>GÖLGE<br>FUTBOL KARİYERİ</h1><div class="m" style="color:var(--gold)">Kulüp başkanlığı simülasyonu</div></div>${s.length?`<button class="b g" onclick="loadW('${s[0].id}')">Kariyere devam et · ${s[0].club}</button>`:""}<button class="b" onclick="SCR='new';render()">Yeni kariyer</button><button class="b" onclick="SCR='saved';render()">Kayıtlı kariyerler (${s.length})</button><button class="b" onclick="SCR='rec';render()">Rekorlar ve istatistikler</button><button class="b" onclick="SCR='set';render()">Ayarlar</button>`};
const back=()=>`<button class="b sm" style="margin:12px 0" onclick="menu()">← Ana menü</button>`;
const vNew=()=>`${back()}<h2>Yeni kariyer</h2><div class="c"><label class="m">Başkan adı</label><input id="fn" value="Ali Utku"><label class="m">Soyadı</label><input id="ln" value="Bağcılar"><label class="m">Kulüp adı</label><input id="cn" value="Gölge FK"><label class="m">Şehir</label><input id="ct" value="İstanbul"><label class="m">Stadyum adı</label><input id="sd" value="Gölge Stadı"><label class="m">Kuruluş yılı</label><input id="fy" value="2026"><label class="m">Kulüp rengi</label><input id="cl" type="color" value="#d9a93a"><label class="m">Kulüp</label><select id="md"><option value="new">Sıfırdan kulüp kur</option><option value="old">Mevcut kulübü yönet</option></select><label class="m">Başlangıç ligi</label><select id="lg">${LG.map((l,i)=>`<option value="${i}" ${i===7?"selected":""}>${l}</option>`).join("")}</select><label class="m">Zorluk</label><select id="df"><option value="0">Kolay</option><option value="1" selected>Normal</option><option value="2">Zor</option></select><label class="m">Başlangıç bütçesi</label><select id="bd"><option value="0">Düşük</option><option value="1" selected>Standart</option><option value="2">Yüksek</option></select><label class="m">Kayıt adı</label><input id="sv" value="Kariyerim"><div class="m">Başlangıç sezonu: 2026–27</div><button class="b g" onclick="startNew()">Kariyere başla</button></div>`;
function startNew(){const g=i=>$("#"+i).value;mkWorld({pres:g("fn")+" "+g("ln"),club:g("cn")||"Gölge FK",city:g("ct"),stad:g("sd")||"Gölge Stadı",found:g("fy"),L0:+g("lg"),diff:+g("df"),bud:+g("bd"),sn:g("sv")||"Kariyer",col:g("cl"),mode:g("md")})}
const vPick=()=>`<h2>Kulüp seç · ${LG[W.o.L0]}</h2>${W.lg[W.o.L0].map(id=>{const t=T(id);return `<div class="c r"><div><b>${t.n}</b><div class="m">İtibar ${Math.round(t.rep)} · ${capOf(t)} koltuk</div></div><button class="b sm g" onclick="W.me=${id};W.o.club=T(${id}).n;begin()">Yönet</button></div>`}).join("")}`;
const vSaved=()=>`${back()}<h2>Kayıtlı kariyerler</h2>${saves().map(s=>`<div class="c r"><div><b>${s.sn}</b><div class="m">${s.club} · ${yr(s.season)}</div></div><div><button class="b sm g" onclick="loadW('${s.id}')">Aç</button> <button class="b sm" onclick="if(confirm('Bu kariyer silinsin mi?'))delW('${s.id}')">Sil</button></div></div>`).join("")||'<div class="m">Kayıt yok.</div>'}`;
function vRec(){let h=[];try{const x=JSON.parse(localStorage.getItem("gfk_"+localStorage.getItem("gfk_last")));h=x.hist||[]}catch(e){}return `${back()}<h2>Rekorlar ve istatistikler</h2><div class="c">${h.length?`<div class="r"><span>Sezon</span><b>${h.length}</b></div><div class="r"><span>Şampiyonluk</span><b>${h.filter(s=>s.my.pos===1).length}</b></div><div class="r"><span>En iyi sıra</span><b>${Math.min(...h.map(s=>s.my.pos))}.</b></div><div class="r"><span>En çok gol (sezon)</span><b>${Math.max(...h.map(s=>s.gk.v))}</b></div>`:'<div class="m">Henüz tamamlanmış sezon yok.</div>'}</div>`}
const vSet=()=>`${back()}<h2>Ayarlar</h2><div class="c"><label class="r"><span>Ağır sakatlıkta otomatik ilerlemeyi durdur</span><input type="checkbox" style="width:auto" ${ST.inj?"checked":""} onchange="ST.inj=this.checked;try{localStorage.setItem('gfk_set',JSON.stringify(ST))}catch(e){}"></label></div>`;
render();
</script></body></html>
